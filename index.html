<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="ScopeLens compares an original project agreement with later client requests so freelancers can spot scope creep. Everything stays in your browser.">
  <!-- Privacy: this policy stops the page from contacting any other site. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ScopeLens</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <header class="topbar no-print">
      <button type="button" id="navToggle" class="icon-btn" data-action="toggle-nav" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-menu"></use></svg>
      </button>
      <a class="brand" href="#/"><img src="assets/logo.svg" alt="" width="28" height="28"><span>ScopeLens</span></a>
    </header>

    <aside class="sidebar no-print" id="sidebar" aria-label="Primary">
      <a class="brand" href="#/"><img src="assets/logo.svg" alt="" width="30" height="30"><span>ScopeLens</span></a>
      <p class="tagline">Catch the changes nobody noticed.</p>
      <nav class="nav" aria-label="Main">
        <a class="nav-link" href="#/"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-folder"></use></svg>Projects</a>
        <a class="nav-link" href="#/new"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>New project</a>
        <a class="nav-link" href="#/data"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-database"></use></svg>Backups</a>
        <a class="nav-link" href="#/about"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-help"></use></svg>How it works</a>
      </nav>
      <p class="side-note">Your projects are saved only in this browser. Nothing is uploaded.</p>
    </aside>
    <div class="scrim no-print" data-action="close-nav" hidden></div>

    <main class="main" id="view" tabindex="-1" aria-live="off">
      <noscript><p class="banner">ScopeLens needs JavaScript to work. It runs only in your browser and sends nothing anywhere.</p></noscript>
      <p class="muted">Loading…</p>
    </main>
  </div>

  <div id="toasts" class="toasts no-print" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
